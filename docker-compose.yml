# Local development database only. Not tested inside the cloud session (no Docker daemon there);
# the same PostgreSQL 16 was run natively instead.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: powerdesk
      POSTGRES_PASSWORD: powerdesk_dev   # local development only
      POSTGRES_DB: powerdesk
    ports:
      - "5432:5432"
    volumes:
      - powerdesk_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U powerdesk"]
      interval: 5s
      retries: 10
volumes:
  powerdesk_pg:
