name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: powerdesk
          POSTGRES_PASSWORD: powerdesk_dev
          POSTGRES_DB: powerdesk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U powerdesk" --health-interval 5s --health-retries 10
    env:
      POWERDESK_TEST_DATABASE_URL: postgresql+psycopg://powerdesk:powerdesk_dev@localhost:5432/powerdesk_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python scripts/verify_setup.py
      - run: ruff check .
      - run: mypy
      - run: pytest -q
